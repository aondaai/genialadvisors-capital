services:
  - type: web
    runtime: static
    name: genialadvisors-capital
    staticPublishPath: .
    buildCommand: ""
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /hero.mp4
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /hero.webm
        name: Cache-Control
        value: public, max-age=31536000, immutable
